<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
    <h2><span id="actionText"></span></h2><img src="../waiting.gif"></img>
    <form name="DemoForm" action="sign" method="POST">
        <input type="hidden" name="tbsPackage"/>
    </form>
    <script type="text/javascript">
        function receiveMessage(event) {
            var matchstr = "(%matchstr%)($|:\\d+$)";
            if (event.origin.match(matchstr) == null) {
                var errRet = {};
                errRet["func"] = "sign";
                errRet["ret_code"] = 0x7600000F;
                errRet["message"] = "禁止存取的網域";
                if (window.opener) {
                    window.opener.postMessage(JSON.stringify(errRet), event.origin);
                }
                window.close();
                return;
            }

            var safeOrigin = event.origin;
            var ret = JSON.parse(event.data);
            var actionText = document.getElementById("actionText");

            if (ret.func) {
                var action = null;
                var actionConfig = {
                    "bulidUnblockCardRequest":          { action: "bulidUnblockCardRequest",          text: "取得解鎖資訊中" },
                    "unblockCard":                      { action: "unblockCard",                      text: "解鎖中" },
                    "generalUnblockCard":               { action: "generalUnblockCard",               text: "解鎖中" },
                    "unblockCardCheckNewPIN":           { action: "unblockCardCheckNewPIN",           text: "解鎖中" },
                    "changeUserPINCode":                { action: "changeUserPINCode",                text: "密碼變更中" },
                    "buildOpenCardGetUserPINRequest":   { action: "buildOpenCardGetUserPINRequest",   text: "開卡作業中" },
                    "buildOpenCardValidateUserRequest": { action: "buildOpenCardValidateUserRequest", text: "開卡作業中" },
                    "openCard":                         { action: "openCard",                         text: "重設作業中" },
                    "openCardCheckNewPIN":              { action: "openCardCheckNewPIN",              text: "重設作業中" },
                    "bulidResetUserPINRequest":         { action: "bulidResetUserPINRequest",         text: "開卡作業中" },
                    "resetUserPIN":                     { action: "resetUserPIN",                     text: "開卡作業中" },
                    "unblockCardGTestCA":               { action: "unblockCardGTestCA",               text: "解鎖中" }
                };

                var config = actionConfig[ret.func];
                if (config) {
                    action = config.action;
                    actionText.innerHTML = config.text;
                }

                if (action != null) {
                    var xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (xhttp.readyState == 4) {
                            if (xhttp.status == 200) {
                                if (window.opener) window.opener.postMessage(xhttp.responseText, safeOrigin);
                                // 保留原本特定的 action 不關閉視窗邏輯
                                if (action === "bulidUnblockCardRequest" || action === "buildOpenCardGetUserPINRequest" || action === "bulidResetUserPINRequest" || action === "buildOpenCardValidateUserRequest") return;
                                window.close();
                            } else {
                                if (window.opener) window.opener.postMessage('{"func":"'+action+'","ret_code":'+xhttp.status+'}', safeOrigin);
                                window.close();
                            }
                        }
                    };
                    xhttp.open("POST", "sendCardCommand", true);
                    xhttp.send("tbsPackage=" + event.data);
                } else {
                    if (window.opener) window.opener.postMessage('{"func":"'+action+'","ret_code":'+0x7600000E+'}', safeOrigin);
                    window.close();
                }
            }
        }

        window.addEventListener("message", receiveMessage, false);
        var tbsData = {};
        tbsData["func"] = "getCardAction";
        var msg = JSON.stringify(tbsData);
        var postTarget = window.opener;

        if (postTarget) {
            var initialOrigin = String.fromCharCode(42); 
            try {
                if (document.referrer) {
                    initialOrigin = new URL(document.referrer).origin;
                }
            } catch (e) {
            }
            
            postTarget.postMessage(msg, initialOrigin);
        }
    </script>
    <br/>
</body>
</html>
